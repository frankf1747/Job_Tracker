<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 16px;
        background: #fbfaf7;
        color: #2c3640;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0 0 14px;
        font-size: 11.5px;
        color: #8b939e;
      }
      label {
        display: block;
        margin-bottom: 9px;
      }
      .micro {
        display: block;
        margin-bottom: 4px;
        font-size: 10px;
        letter-spacing: 0.09em;
        color: #6b7078;
      }
      input {
        width: 100%;
        background: #fff;
        border: 1.5px solid #cfc8b9;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: #41678a;
      }
      button {
        width: 100%;
        border-radius: 7px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .primary {
        background: #41678a;
        border: 1px solid #41678a;
        color: #f4f2ec;
      }
      .ghost {
        background: transparent;
        border: 1px solid #cfc8b9;
        color: #5f6a75;
        font-weight: 500;
      }
      .msg {
        margin-top: 10px;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .err {
        color: #a35242;
      }
      .who {
        margin: 0 0 12px;
        font-size: 12.5px;
      }
      .who b {
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Job Tracker</h1>
    <p class="sub">Queue postings to apply to later.</p>

    <form id="signin" hidden>
      <label>
        <span class="micro">USERNAME</span>
        <input id="username" autocomplete="username" autofocus />
      </label>
      <label>
        <span class="micro">PASSCODE</span>
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button class="primary" type="submit">Sign in</button>
    </form>

    <div id="account" hidden>
      <p class="who">Signed in as <b id="who"></b></p>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </div>

    <div class="msg" id="msg"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
