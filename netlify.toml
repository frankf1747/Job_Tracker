[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches the version the build is verified on locally. Vite 8 requires
  # >= 20.19, so this cannot drift below that.
  NODE_VERSION = "20"

# A single-page app: every path has to serve index.html rather than 404.
# The magic-link callback lands back on the origin, so this covers it too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This app holds personal data and has no need for any of these.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Hashed asset filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
